<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Calendar body -->
  <rect x="36" y="54" width="128" height="114" rx="10" stroke="white" stroke-width="4" fill="white" fill-opacity="0.1"/>
  <!-- Calendar header bar -->
  <rect x="36" y="54" width="128" height="34" rx="10" fill="white" fill-opacity="0.2"/>
  <rect x="36" y="76" width="128" height="12" fill="white" fill-opacity="0.2"/>
  <!-- Ring hooks -->
  <line x1="70" y1="38" x2="70" y2="68" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="130" y1="38" x2="130" y2="68" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Grid dots (days) -->
  <circle cx="62" cy="110" r="5" fill="white"/>
  <circle cx="84" cy="110" r="5" fill="white"/>
  <circle cx="106" cy="110" r="5" fill="white"/>
  <circle cx="128" cy="110" r="5" fill="white"/>
  <circle cx="150" cy="110" r="5" fill="white"/>
  <circle cx="62" cy="132" r="5" fill="white"/>
  <circle cx="84" cy="132" r="5" fill="white"/>
  <circle cx="106" cy="132" r="5" fill="white"/>
  <circle cx="128" cy="132" r="5" fill="white"/>
  <!-- Highlighted day (event) -->
  <circle cx="150" cy="132" r="9" fill="white"/>
  <circle cx="62" cy="154" r="5" fill="white"/>
  <circle cx="84" cy="154" r="5" fill="white"/>
  <!-- Star on highlighted day -->
  <text x="150" y="137" text-anchor="middle" font-size="10" fill="white" fill-opacity="0.2" font-family="sans-serif">★</text>
</svg>
